<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lengkapi Pembelajaran - Learning Organizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #ff9a9e, #fecfef);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      min-height: 100vh; padding: 40px 15px;
    }
    @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
    .glass-container {
      background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(15px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      max-width: 900px; margin: 0 auto; padding: 30px; animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp { from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);} }
    .section-card {
      background: rgba(255, 255, 255, 0.6); border-radius: 15px; padding: 25px; margin-bottom: 25px; 
      border-left: 6px solid #667eea; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 { color: #2c3e50; font-weight: 700; text-align: center; }
    h5.section-title { color: #667eea; font-weight: 700; margin-bottom: 20px; border-bottom: 2px dashed rgba(102,126,234,0.3); padding-bottom: 10px;}
    .form-label { font-weight: 600; color: #34495e; font-size: 0.85rem; margin-bottom: 0.3rem;}
    .form-control, .form-select { background: rgba(255,255,255,0.8); border-radius: 8px; border: 1px solid white; font-size: 0.9rem;}
    .form-control:focus, .form-select:focus { background: #fff; box-shadow: 0 0 8px rgba(102, 126, 234, 0.3); border-color: #667eea; }
    .sintaks-box { background: rgba(255,255,255,0.85); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid rgba(102, 126, 234, 0.3);}
    .sintaks-title { font-weight: 700; color: #2c3e50; font-size: 0.95rem; margin-bottom: 10px;}
    #timeTracker {
      position: sticky; top: 20px; z-index: 100; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; font-weight: 700; text-align: center; border-radius: 30px; padding: 12px 20px; margin-bottom: 25px;
      box-shadow: 0 10px 20px rgba(118, 75, 162, 0.4); transition: 0.3s;
    }
    .time-alert { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%) !important; }
    .time-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%) !important; }
    .btn-custom {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; font-weight: 700; 
      border-radius: 30px; padding: 15px; width: 100%; font-size: 1.1rem; transition: 0.3s;
    }
    .btn-custom:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3); color: white;}
  </style>
</head>
<body>

  <div class="glass-container">
    <h2 class="mb-2">📝 Detail Pembelajaran</h2>
    <p class="text-center text-muted mb-4" id="judulModel" style="font-weight: 600;">Memuat Model...</p>

    <div id="timeTracker">Total Waktu: <span id="displayTotal">0</span> Menit | Sisa: <span id="displaySisa">0</span> Menit</div>

    <form id="formLengkap">
      
      <!-- BAGIAN 1: KOMPONEN INTI -->
      <div class="section-card">
        <h5 class="section-title">1. Komponen Inti</h5>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Capaian Kompetensi (CP)</label>
            <textarea class="form-control" id="cp" rows="3" required>Peserta didik mampu memahami konsep dasar pemecahan masalah dan menerapkannya dalam kehidupan sehari-hari secara kritis dan kreatif.</textarea>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Tujuan Pembelajaran (TP)</label>
            <textarea class="form-control" id="tp" rows="3" required>Melalui diskusi kelompok, peserta didik dapat mengidentifikasi masalah pencemaran lingkungan dan merancang satu solusi sederhana dengan tepat.</textarea>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Materi Esensial</label>
            <textarea class="form-control" id="materi" rows="2" required>Penyebab pencemaran lingkungan (sampah plastik) dan dampaknya.</textarea>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Pertanyaan Pemantik</label>
            <textarea class="form-control" id="pemantik" rows="2" required>"Pernahkah kalian melihat tumpukan botol plastik di sungai? Apa yang akan terjadi jika dibiarkan?"</textarea>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label">Dimensi Profil Pelajar Pancasila</label>
          <div class="row px-2">
            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input profil-cb" value="Beriman & Bertaqwa" type="checkbox" checked> <label class="form-check-label">Beriman & Bertaqwa</label></div></div>
            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input profil-cb" value="Bergotong Royong" type="checkbox" checked> <label class="form-check-label">Bergotong Royong</label></div></div>
            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input profil-cb" value="Bernalar Kritis" type="checkbox" checked> <label class="form-check-label">Bernalar Kritis</label></div></div>
            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input profil-cb" value="Mandiri" type="checkbox"> <label class="form-check-label">Mandiri</label></div></div>
            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input profil-cb" value="Kreatif" type="checkbox" checked> <label class="form-check-label">Kreatif</label></div></div>
            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input profil-cb" value="Berkebinekaan Global" type="checkbox"> <label class="form-check-label">Berkebinekaan Global</label></div></div>
          </div>
        </div>
      </div>

      <!-- BAGIAN 2: EKOSISTEM PEMBELAJARAN -->
      <div class="section-card">
        <h5 class="section-title">2. Ekosistem Pembelajaran</h5>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Pendekatan Pembelajaran</label>
            <input type="text" class="form-control" id="pendekatan" value="Pendekatan Saintifik, TPACK" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Metode Pembelajaran</label>
            <input type="text" class="form-control" id="metode" value="Diskusi Kelompok, Tanya Jawab, Penugasan" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Pemanfaatan Digital (EdTech)</label>
            <input type="text" class="form-control" id="digital" value="Video YouTube, Google Jamboard, Quizizz" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Sarana & Prasarana</label>
            <input type="text" class="form-control" id="sarpras" value="Proyektor, Laptop, Kertas Karton, Spidol" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Lingkungan Pembelajaran</label>
            <input type="text" class="form-control" id="lingkungan" value="Ruang Kelas & Halaman Sekolah" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Mitra Pembelajaran (Jika ada)</label>
            <input type="text" class="form-control" id="mitra" value="Petugas Kebersihan Sekolah (Narasumber singkat)">
          </div>
        </div>
      </div>

      <!-- BAGIAN 3: SINTAKS (OTOMATIS) -->
      <div class="section-card">
        <h5 class="section-title">3. Skenario & Langkah Pembelajaran (Sintaks)</h5>
        <div class="alert alert-info" style="font-size: 0.85rem; padding: 10px;">💡 <b>Tips:</b> Atur waktu hingga Sisa Waktu mencapai 0!</div>
        <div id="wadahSintaks"></div>
      </div>

      <!-- BAGIAN 4: ASESMEN & LAMPIRAN -->
      <div class="section-card">
        <h5 class="section-title">4. Asesmen & Lampiran</h5>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Jenis Asesmen</label>
            <select class="form-select" id="jenisAsesmen">
              <option>Formatif (Proses Belajar)</option>
              <option>Sumatif (Akhir Belajar)</option>
              <option>Diagnostik (Awal Kesiapan)</option>
              <option selected>Diagnostik & Formatif</option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Metode Asesmen</label>
            <input type="text" class="form-control" id="metodeAsesmen" value="Observasi Kinerja & Tes Lisan" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Bentuk Instrumen</label>
            <input type="text" class="form-control" id="instrumenAsesmen" value="Rubrik Penilaian Presentasi" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Tautan / Link Instrumen (Drive)</label>
            <input type="url" class="form-control" id="linkInstrumen" value="https://drive.google.com/">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Tautan / Link LKPD Siswa (Drive)</label>
            <input type="url" class="form-control" id="linkLkpd" value="https://drive.google.com/">
          </div>
          <div class="col-12 mt-2">
            <label class="form-label">Rencana Refleksi</label>
            <textarea class="form-control" id="refleksi" rows="2" required>Siswa: Mengisi emoji perasaan setelah belajar. Guru: Menilai apakah metode diskusi berjalan efektif.</textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-custom" id="btnSimpan">Simpan Data Lengkap & Masuk Play Mode 🚀</button>
    </form>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbzYzp1rzv10ya5yMA9f8YfISo31eIL-DuC6cuZKvDF79ytrUMH4Ssmsl4-KVhN-KA4wSg/exec";

    // Database Template Sintaks + CONTOH BAKU (15 Model)
    const masterSintaks = {
      'M01': [ // PBL
        { fase: "Fase 1: Orientasi siswa pada masalah", contoh: "Guru menayangkan video/gambar tentang pencemaran sungai. Siswa mengamati dan dirangsang untuk bertanya mengenai penyebab dan dampak masalah tersebut." },
        { fase: "Fase 2: Mengorganisasi siswa untuk belajar", contoh: "Guru membagi siswa ke dalam kelompok beranggota 4 orang. Siswa membagi tugas untuk mencari data terkait sumber pencemaran." },
        { fase: "Fase 3: Membimbing penyelidikan individu/kelompok", contoh: "Siswa melakukan diskusi kelompok dan mencari literatur di buku/internet. Guru berkeliling memberikan *scaffolding* (bantuan terbatas)." },
        { fase: "Fase 4: Mengembangkan dan menyajikan hasil karya", contoh: "Siswa menyusun laporan singkat atau poster solusi pemecahan masalah, lalu mempresentasikannya di depan kelas." },
        { fase: "Fase 5: Menganalisis dan mengevaluasi", contoh: "Guru dan kelompok lain memberikan tanggapan. Guru meluruskan miskonsepsi dan memberikan penguatan konsep." }
      ],
      'M02': [ // PjBL
        { fase: "Fase 1: Pertanyaan mendasar", contoh: "Guru memantik siswa: 'Bagaimana cara kita mengurangi sampah plastik di sekolah?' Siswa merespons dengan berbagai ide produk daur ulang." },
        { fase: "Fase 2: Menyusun perencanaan proyek", contoh: "Siswa dalam kelompok berdiskusi menentukan jenis produk daur ulang yang akan dibuat, membagi peran, dan menyiapkan daftar alat/bahan." },
        { fase: "Fase 3: Menyusun jadwal", contoh: "Guru dan siswa menyepakati tenggat waktu (misal: 2 pertemuan). Pertemuan pertama untuk desain, pertemuan kedua untuk perakitan." },
        { fase: "Fase 4: Memonitor kemajuan proyek", contoh: "Siswa mulai membuat produk. Guru berkeliling memantau progres, mencatat keaktifan, dan membantu kendala teknis." },
        { fase: "Fase 5: Menguji hasil (presentasi)", contoh: "Setiap kelompok memamerkan produk daur ulangnya (Pameran Karya/Gallery Walk). Kelompok lain memberikan apresiasi dan masukan." },
        { fase: "Fase 6: Evaluasi pengalaman belajar", contoh: "Guru mengajak siswa merefleksikan perasaan mereka selama membuat proyek dan kendala apa yang berhasil diatasi." }
      ],
      'M03': [ // Cooperative Learning
        { fase: "Fase 1: Menyampaikan tujuan & motivasi", contoh: "Guru menyampaikan tujuan pembelajaran hari ini dan menjelaskan pentingnya kerja sama tim dalam menyelesaikan misi." },
        { fase: "Fase 2: Menyajikan informasi", contoh: "Guru memberikan penjelasan materi inti secara singkat (ceramah/video) sebagai bekal dasar bagi siswa." },
        { fase: "Fase 3: Mengorganisasikan kelompok", contoh: "Guru membagi kelas menjadi kelompok heterogen (campuran tingkat kemampuan). Guru membagikan Lembar Kerja Kelompok." },
        { fase: "Fase 4: Membimbing kelompok bekerja", contoh: "Siswa saling berdiskusi dan tutor sebaya di dalam kelompok. Guru memantau dinamika interaksi antarsiswa." },
        { fase: "Fase 5: Evaluasi", contoh: "Guru memberikan kuis individual untuk mengukur pemahaman masing-masing siswa setelah belajar berkelompok." },
        { fase: "Fase 6: Memberikan penghargaan", contoh: "Guru mengumumkan kelompok dengan skor rata-rata tertinggi dan memberikan apresiasi (sertifikat/bintang)." }
      ],
      'M04': [ // Discovery Learning
        { fase: "Fase 1: Pemberian rangsangan", contoh: "Guru membawa dua gelas berisi air tawar dan air garam, lalu memasukkan telur ke dalamnya (satu tenggelam, satu mengapung). Siswa mengamati keheranan." },
        { fase: "Fase 2: Identifikasi masalah", contoh: "Siswa merumuskan hipotesis: 'Mengapa telur bisa mengapung di air garam?'" },
        { fase: "Fase 3: Pengumpulan data", contoh: "Siswa melakukan eksperimen sendiri dengan menambahkan garam sendok demi sendok dan mencatat perubahannya." },
        { fase: "Fase 4: Pengolahan data", contoh: "Siswa mendiskusikan hasil catatannya dan membandingkan antara jumlah garam dengan posisi telur." },
        { fase: "Fase 5: Pembuktian", contoh: "Siswa mencocokkan hasil eksperimen mereka dengan teori massa jenis zat cair dari buku teks." },
        { fase: "Fase 6: Menarik simpulan", contoh: "Siswa menyimpulkan bahwa penambahan garam meningkatkan massa jenis air." }
      ],
      'M05': [ // CTL
        { fase: "Fase 1: Konstruktivisme (Membangun konsep)", contoh: "Guru meminta siswa menceritakan pengalamannya berbelanja di pasar tradisional untuk mengaitkan materi aritmatika sosial." },
        { fase: "Fase 2: Inkuiri (Menyelidiki)", contoh: "Siswa dibagi kelompok untuk menyelidiki brosur diskon minimarket dan mencari tahu harga asli." },
        { fase: "Fase 3: Bertanya (Questioning)", contoh: "Guru mendorong siswa saling bertanya kepada kelompok lain terkait cara perhitungan diskon yang mereka gunakan." },
        { fase: "Fase 4: Masyarakat Belajar (Learning Community)", contoh: "Siswa berdiskusi menyatukan pendapat dan menemukan rumus diskon secara bersama-sama." },
        { fase: "Fase 5: Pemodelan (Modeling)", contoh: "Guru mendemonstrasikan satu contoh cara berhitung cepat diskon sebagai model acuan siswa." },
        { fase: "Fase 6: Refleksi", contoh: "Siswa mencatat apa saja hal baru yang mereka temukan hari ini terkait aritmatika sosial." },
        { fase: "Fase 7: Asesmen Autentik", contoh: "Siswa diberi tugas mempraktikkan simulasi jual beli di depan kelas." }
      ],
      'M06': [ // Direct Instruction
        { fase: "Fase 1: Tujuan dan Persiapan", contoh: "Guru menyebutkan tujuan pembelajaran (mampu melukis sudut 90 derajat) dan memastikan semua siswa membawa jangka." },
        { fase: "Fase 2: Demonstrasi (I Do)", contoh: "Guru mempraktikkan langkah-demi-langkah melukis sudut 90 derajat menggunakan alat peraga besar di papan tulis, sambil menjelaskan alasannya." },
        { fase: "Fase 3: Latihan Terbimbing (We Do)", contoh: "Siswa melukis di buku masing-masing secara bersama-sama mengikuti aba-aba dan hitungan langkah dari guru." },
        { fase: "Fase 4: Cek Pemahaman", contoh: "Guru berkeliling mengecek hasil goresan jangka siswa dan mengoreksi jika ada titik tumpu yang salah." },
        { fase: "Fase 5: Latihan Mandiri (You Do)", contoh: "Siswa diberikan 3 soal untuk melukis sudut secara mandiri tanpa panduan langsung dari guru." }
      ],
      'M07': [ // Flipped Classroom
        { fase: "Fase 1: Persiapan Mandiri (Di Rumah)", contoh: "Siswa ditugaskan menonton video YouTube tentang proses fotosintesis yang sudah di-share guru semalam." },
        { fase: "Fase 2: Diskusi Awal (Awal Kelas)", contoh: "Guru memandu sesi Q&A singkat: 'Apa bagian dari video semalam yang paling sulit dipahami?'" },
        { fase: "Fase 3: Aktivitas Kolaboratif", contoh: "Waktu kelas dihabiskan 100% untuk eksperimen uji amilum pada daun (pembuktian fotosintesis) dalam kelompok." },
        { fase: "Fase 4: Evaluasi & Umpan Balik", contoh: "Siswa mempresentasikan hasil uji daunnya, guru memberikan penilaian formatif." }
      ],
      'M08': [ // Blended Learning
        { fase: "Fase 1: Tatap Muka (Penyampaian Konsep)", contoh: "Guru menjelaskan konsep dasar Tata Surya secara langsung di dalam kelas menggunakan proyektor." },
        { fase: "Fase 2: Pembelajaran Online", contoh: "Siswa mengakses Google Classroom di rumah untuk membaca modul interaktif planet-planet." },
        { fase: "Fase 3: Kolaborasi Virtual", contoh: "Siswa berdiskusi di forum LMS terkait pertanyaan pemantik: 'Mungkinkah ada kehidupan di Mars?'" },
        { fase: "Fase 4: Asesmen Terintegrasi", contoh: "Siswa mengerjakan kuis online di Quizizz yang nilainya otomatis masuk ke rekap guru." }
      ],
      'M09': [ // Game-Based Learning
        { fase: "Fase 1: Penjelasan Aturan", contoh: "Guru menjelaskan aturan permainan 'Estafet Kosakata Bahasa Inggris' dan sistem poinnya." },
        { fase: "Fase 2: Bermain (Game Play)", contoh: "Siswa berbaris memanjang, bergiliran berlari ke papan tulis untuk menuliskan kosa kata secara estafet dalam waktu 5 menit." },
        { fase: "Fase 3: Refleksi Pengalaman", contoh: "Siswa mengatur napas, guru bertanya bagaimana strategi tim mereka agar bisa cepat dan tepat." },
        { fase: "Fase 4: Penarikan Kesimpulan", contoh: "Guru mengoreksi kosakata di papan tulis dan memberikan penguatan makna atas kata-kata tersebut." }
      ],
      'M10': [ // Quantum Learning (TANDUR)
        { fase: "Fase 1: Tumbuhkan (Apersepsi)", contoh: "Guru memutar musik instrumental yang tenang dan mengajak siswa berimajinasi berada di pegunungan (materi Puisi)." },
        { fase: "Fase 2: Alami", contoh: "Siswa diajak keluar kelas selama 5 menit untuk menyentuh daun dan merasakan angin untuk mendapatkan inspirasi." },
        { fase: "Fase 3: Namai", contoh: "Guru menjelaskan bahwa kata-kata indah yang mewakili perasaan tadi disebut 'Diksi' dan 'Majas'." },
        { fase: "Fase 4: Demonstrasikan", contoh: "Siswa mulai menulis puisi 2 bait berdasarkan pengalaman di luar kelas tadi." },
        { fase: "Fase 5: Ulangi", contoh: "Beberapa siswa diminta membacakan puisinya dengan lantang." },
        { fase: "Fase 6: Rayakan", contoh: "Seluruh kelas memberikan *applause* meriah dan yel-yel penyemangat untuk siswa yang berani tampil." }
      ],
      'M11': [ // Peer Teaching
        { fase: "Fase 1: Penjelasan Konsep Umum", contoh: "Guru menjelaskan konsep Operasi Pecahan secara garis besar selama 15 menit." },
        { fase: "Fase 2: Penunjukan Tutor Sebaya", contoh: "Guru membagi kelompok dan menunjuk 1 siswa yang memiliki pemahaman cepat (Tutor) di setiap kelompok." },
        { fase: "Fase 3: Proses Bimbingan Sebaya", contoh: "Tutor sebaya mengajarkan ulang cara menyamakan penyebut kepada teman sekelompoknya menggunakan bahasa mereka sendiri." },
        { fase: "Fase 4: Konfirmasi Pemahaman", contoh: "Anggota (bukan tutor) ditunjuk secara acak untuk mengerjakan soal di papan tulis." },
        { fase: "Fase 5: Evaluasi & Klarifikasi", contoh: "Guru mengklarifikasi jika ada langkah tutor yang keliru dan memberikan penekanan konsep." }
      ],
      'M12': [ // Team Games Tournament (TGT)
        { fase: "Fase 1: Penyajian Kelas", contoh: "Guru menyajikan materi Sejarah Kemerdekaan menggunakan presentasi." },
        { fase: "Fase 2: Belajar Kelompok", contoh: "Siswa kembali ke kelompoknya untuk saling menguji hafalan tokoh dan tahun kejadian (drill & practice)." },
        { fase: "Fase 3: Permainan", contoh: "Setiap perwakilan kelompok maju ke meja turnamen untuk mengambil kartu soal secara acak." },
        { fase: "Fase 4: Turnamen", contoh: "Siswa beradu cepat menjawab kartu soal. Jika benar mendapat skor untuk tim asalnya." },
        { fase: "Fase 5: Penghargaan Kelompok", contoh: "Skor diakumulasi, guru memberikan predikat 'Super Team', 'Great Team', dan 'Good Team'." }
      ],
      'M13': [ // Jigsaw
        { fase: "Fase 1: Kelompok Asal", contoh: "Siswa dibagi menjadi kelompok beranggota 3 orang. Materi dibagi 3: Akar, Batang, dan Daun." },
        { fase: "Fase 2: Kelompok Ahli", contoh: "Siswa yang mendapat materi 'Akar' berkumpul dengan siswa 'Akar' dari kelompok lain untuk mendalami materinya bersama." },
        { fase: "Fase 3: Diskusi Ahli", contoh: "Kelompok ahli membuat catatan penting dan strategi bagaimana mengajarkannya nanti." },
        { fase: "Fase 4: Mengajar di Kelompok Asal", contoh: "Siswa kembali ke kelompok asalnya. Si Ahli Akar mengajari temannya, bergantian dengan Ahli Batang dan Daun." },
        { fase: "Fase 5: Evaluasi Individu", contoh: "Siswa diberi kuis tertulis mencakup seluruh materi (Akar, Batang, Daun) secara mandiri." }
      ],
      'M14': [ // Experiential Learning
        { fase: "Fase 1: Pengalaman Konkret", contoh: "Siswa dibawa ke kebun sekolah dan langsung ditugaskan menanam biji kacang hijau di media yang berbeda (tanah vs kapas)." },
        { fase: "Fase 2: Observasi Reflektif", contoh: "Selama 3 hari, siswa mengamati dan mencatat perbedaan kecepatan pertumbuhan tunas." },
        { fase: "Fase 3: Konseptualisasi Abstrak", contoh: "Siswa memikirkan dan menarik teori mengapa media tanah membuat batang tumbuh lebih kuat dibanding kapas." },
        { fase: "Fase 4: Eksperimentasi Aktif", contoh: "Siswa merencanakan eksperimen lanjutan dengan mencoba menambahkan pupuk cair." }
      ],
      'M15': [ // Self-Directed Learning
        { fase: "Fase 1: Penilaian Kesiapan", contoh: "Guru memberikan kuesioner minat untuk mengetahui topik sains apa yang paling diminati tiap individu." },
        { fase: "Fase 2: Penetapan Tujuan", contoh: "Siswa A memilih membuat proyek gunung meletus, Siswa B memilih proyek tata surya. Guru menyetujuinya." },
        { fase: "Fase 3: Perencanaan Strategi", contoh: "Siswa secara mandiri membuat jadwal kapan mencari alat bahan, dan kapan merakitnya." },
        { fase: "Fase 4: Pelaksanaan Mandiri", contoh: "Siswa mengeksekusi belajarnya sendiri di perpustakaan/lab. Guru memantau dari jauh." },
        { fase: "Fase 5: Evaluasi Diri", contoh: "Siswa membuat video refleksi tentang seberapa puas mereka dengan hasil proyek buatannya sendiri." }
      ]
    };

    let totalWaktu = 0;

    document.addEventListener("DOMContentLoaded", function() {
      let idModel = localStorage.getItem('lo_id_model');
      if(!idModel) {
        alert("Sesi terputus! Mengembalikan ke halaman awal.");
        window.location.href = "index.html"; return;
      }
      totalWaktu = parseInt(localStorage.getItem('lo_waktu')) || 90;
      document.getElementById('judulModel').innerText = localStorage.getItem('lo_nama_model');
      document.getElementById('displayTotal').innerText = totalWaktu;
      document.getElementById('displaySisa').innerText = totalWaktu;

      let wadah = document.getElementById('wadahSintaks');
      
      // MENGAMBIL DATA OBJEK (Fase & Contoh Baku)
      let daftarFase = masterSintaks[idModel] || [{fase: "Fase Inti Pembelajaran", contoh: "Tuliskan aktivitas guru dan siswa di sini..."}];

      daftarFase.forEach((item, index) => {
        let box = document.createElement('div');
        box.className = 'sintaks-box';
        
        let defaultPengalaman = "Memahami";
        if(index > 0 && index < daftarFase.length - 1) defaultPengalaman = "Mengaplikasikan";
        if(index === daftarFase.length - 1) defaultPengalaman = "Merefleksikan";

        // MENGINJEKSIKAN CONTOH KE DALAM TEXTAREA
        box.innerHTML = `
          <div class="sintaks-title">${item.fase}</div>
          <div class="row">
            <div class="col-md-7 mb-2">
              <label class="form-label text-muted">Aktivitas Guru & Siswa (Bisa Diedit)</label>
              <textarea class="form-control input-aktivitas" rows="3" required>${item.contoh}</textarea>
            </div>
            <div class="col-md-3 mb-2">
              <label class="form-label text-muted">Pengalaman Belajar</label>
              <select class="form-select input-pengalaman">
                <option ${defaultPengalaman === 'Memahami' ? 'selected' : ''}>Memahami</option>
                <option ${defaultPengalaman === 'Mengaplikasikan' ? 'selected' : ''}>Mengaplikasikan</option>
                <option ${defaultPengalaman === 'Merefleksikan' ? 'selected' : ''}>Merefleksikan</option>
              </select>
            </div>
            <div class="col-md-2 mb-2">
              <label class="form-label text-muted">Durasi (Menit)</label>
              <input type="number" class="form-control input-waktu" placeholder="0" min="1" onkeyup="hitungWaktu()" onchange="hitungWaktu()" required>
            </div>
          </div>
        `;
        wadah.appendChild(box);
      });
    });

    function hitungWaktu() {
      let inputs = document.querySelectorAll('.input-waktu');
      let totalTerpakai = 0;
      inputs.forEach(input => { totalTerpakai += parseInt(input.value) || 0; });
      let sisa = totalWaktu - totalTerpakai;
      let tracker = document.getElementById('timeTracker');
      let displaySisa = document.getElementById('displaySisa');
      
      displaySisa.innerText = sisa;
      if (sisa > 0) { tracker.className = ''; tracker.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      } else if (sisa === 0) { tracker.className = 'time-success';
      } else { tracker.className = 'time-alert'; displaySisa.innerText = sisa + " (Kelebihan!)"; }
    }

    document.getElementById('formLengkap').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      let sisa = parseInt(document.getElementById('displaySisa').innerText);
      if(sisa !== 0) {
        alert("Mohon atur waktu di setiap Sintaks agar Sisa Waktu persis 0 Menit!");
        return;
      }

      let btn = document.getElementById('btnSimpan');
      btn.innerHTML = 'Menyimpan ke Database... ⏳'; btn.style.opacity = '0.7'; btn.disabled = true;

      // 1. Profil Pancasila
      let arrProfil = [];
      document.querySelectorAll('.profil-cb:checked').forEach(cb => arrProfil.push(cb.value));

      // 2. Ekosistem & Asesmen
      let dataEkosistem = JSON.stringify({
        pendekatan: document.getElementById('pendekatan').value,
        metode: document.getElementById('metode').value,
        digital: document.getElementById('digital').value,
        sarpras: document.getElementById('sarpras').value,
        lingkungan: document.getElementById('lingkungan').value,
        mitra: document.getElementById('mitra').value
      });

      let dataAsesmen = JSON.stringify({
        jenis: document.getElementById('jenisAsesmen').value,
        metode: document.getElementById('metodeAsesmen').value,
        instrumen: document.getElementById('instrumenAsesmen').value,
        link_instrumen: document.getElementById('linkInstrumen').value,
        link_lkpd: document.getElementById('linkLkpd').value
      });

      // 3. Sintaks (Menangkap hasil ketikan/editan guru)
      let arrSintaks = [];
      let boxes = document.querySelectorAll('.sintaks-box');
      boxes.forEach(box => {
        arrSintaks.push({
          fase: box.querySelector('.sintaks-title').innerText,
          aktivitas: box.querySelector('.input-aktivitas').value,
          pengalaman: box.querySelector('.input-pengalaman').value,
          durasi: parseInt(box.querySelector('.input-waktu').value)
        });
      });

      // 4. Membungkus Payload
      let payload = {
        idModul: localStorage.getItem('lo_id_modul'),
        capaian: document.getElementById('cp').value,
        tujuan: document.getElementById('tp').value,
        materi: document.getElementById('materi').value,
        pemantik: document.getElementById('pemantik').value,
        profil: arrProfil.join(", "),
        ekosistem: dataEkosistem,
        asesmen: dataAsesmen,
        refleksi: document.getElementById('refleksi').value,
        sintaks_detail: arrSintaks
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.status === "success") {
          alert("Sempurna! RPP Komprehensif Anda berhasil dikunci di Database.");
          btn.innerHTML = 'Berhasil! Menyiapkan Play Mode ✨';
          btn.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
          
          // Redirect ke halaman Play Mode
          // window.location.href = "play.html";
        } else {
          alert("Error Database: " + result.message);
          btn.innerHTML = 'Coba Lagi 🚀'; btn.style.opacity = '1'; btn.disabled = false;
        }
      } catch (error) {
        alert("Gagal koneksi. Cek jaringan Anda.");
        btn.innerHTML = 'Coba Lagi 🚀'; btn.style.opacity = '1'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
