<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Mode - Learning Organizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Mode Gelap Elegan (Focus Mode) untuk di Kelas */
    body { 
      background: #0f2027; background: linear-gradient(to right, #2c5364, #203a43, #0f2027); 
      color: white; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; 
      display: flex; flex-direction: column; padding: 20px;
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 30px; }
    .top-bar h4 { font-weight: 700; margin: 0; color: #00d2ff; }
    
    .glass-panel { 
      background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); 
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; 
      flex-grow: 1; display: flex; flex-direction: column; justify-content: center;
    }
    
    #faseTitle { font-size: 2rem; font-weight: 700; color: #00d2ff; text-transform: uppercase; letter-spacing: 2px;}
    #faseAktivitas { font-size: 1.3rem; color: #e0e0e0; margin-top: 15px; line-height: 1.6; min-height: 100px; }
    #fasePengalaman { display: inline-block; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2);}
    
    /* Stopwatch Raksasa */
    .timer-display { 
      font-size: 10rem; font-weight: 700; text-align: center; 
      text-shadow: 0 0 30px rgba(0, 210, 255, 0.3); font-variant-numeric: tabular-nums; 
      line-height: 1; margin: 30px 0; transition: color 0.3s, text-shadow 0.3s;
    }
    
    /* Animasi saat waktu < 1 Menit */
    .warning { 
      color: #ff4b2b !important; 
      text-shadow: 0 0 40px rgba(255, 75, 43, 0.8) !important; 
      animation: pulse 1s infinite; 
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    
    /* Tombol Navigasi */
    .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .btn-action { font-size: 1.2rem; font-weight: 600; padding: 15px 40px; border-radius: 50px; transition: 0.3s; border: none; cursor: pointer; }
    .btn-extend { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.5); }
    .btn-extend:hover { background: rgba(255,255,255,0.1); border-color: white; }
    .btn-next { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3); }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(17, 153, 142, 0.5); }
    
    #progressText { color: rgba(255,255,255,0.5); font-weight: 600; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h4 id="namaModelHeader">🚀 Live Class Mode</h4>
    <div id="progressText">Tahap 1 dari X</div>
  </div>

  <div class="glass-panel" id="mainPanel">
    <div class="text-center">
      <div id="faseTitle">Memuat Fase...</div>
      <div id="fasePengalaman">Target: Memahami</div>
      <div id="faseAktivitas">Deskripsi aktivitas akan muncul di sini...</div>
      
      <!-- Waktu Berjalan -->
      <div class="timer-display" id="timerDisplay">00:00</div>
      
      <div class="controls">
        <!-- Tombol Tambah Waktu (Jika molor) -->
        <button class="btn-action btn-extend" onclick="tambahWaktu()">+ 5 Menit</button>
        <!-- Tombol Selesai/Lanjut -->
        <button class="btn-action btn-next" onclick="nextFase()" id="btnNext">Lanjut Fase Berikutnya ➔</button>
      </div>
    </div>
  </div>

  <script>
    let sintaks = [];
    let currentIndex = 0;
    let timeRemaining = 0; // dalam detik
    let timerInterval;
    let isWarningPlayed = false;

    document.addEventListener("DOMContentLoaded", function() {
      // Mengambil data RPP yang tadi dititipkan
      let dataSintaks = localStorage.getItem('lo_sintaks_play');
      let namaModel = localStorage.getItem('lo_nama_model');
      
      if(!dataSintaks) {
        alert("Tidak ada skenario kelas yang berjalan. Kembali ke beranda.");
        window.location.href = "index.html"; return;
      }

      sintaks = JSON.parse(dataSintaks);
      document.getElementById('namaModelHeader').innerText = "🔴 LIVE: " + namaModel;
      
      // Memulai fase pertama
      loadFase(0);
    });

    function loadFase(index) {
      clearInterval(timerInterval);
      isWarningPlayed = false;
      document.getElementById('timerDisplay').classList.remove('warning');
      
      // Jika semua fase sudah habis
      if (index >= sintaks.length) {
        selesaiSesi();
        return;
      }
      
      let fase = sintaks[index];
      document.getElementById('faseTitle').innerText = fase.fase;
      document.getElementById('faseAktivitas').innerText = fase.aktivitas;
      document.getElementById('fasePengalaman').innerText = "Fokus Pengalaman: " + fase.pengalaman;
      
      // Mengubah menit ke detik
      timeRemaining = fase.durasi * 60; 
      updateDisplay();
      
      // Menyalakan Stopwatch (1000ms = 1 detik)
      timerInterval = setInterval(tick, 1000);
      
      document.getElementById('progressText').innerText = `Tahap ${index + 1} dari ${sintaks.length}`;
      
      if(index === sintaks.length - 1) {
        document.getElementById('btnNext').innerText = "Akhiri Pembelajaran 🏁";
      }
    }

    function tick() {
      if (timeRemaining > 0) {
        timeRemaining--;
        updateDisplay();
        
        // TRIGGER ALARM SAAT TERSISA 60 DETIK (1 MENIT)
        if (timeRemaining === 60 && !isWarningPlayed) {
           document.getElementById('timerDisplay').classList.add('warning');
           bunyikanAlarm();
           isWarningPlayed = true;
        }
      } else {
        // Jika waktu 0, kedip-kedip menahan di 00:00 sampai guru klik Lanjut atau +5 Menit
        document.getElementById('timerDisplay').classList.add('warning');
      }
    }

    function updateDisplay() {
      let m = Math.floor(timeRemaining / 60);
      let s = timeRemaining % 60;
      document.getElementById('timerDisplay').innerText = 
        (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
    }

    function tambahWaktu() {
      timeRemaining += 300; // Ekstensi 5 Menit (300 detik)
      document.getElementById('timerDisplay').classList.remove('warning');
      isWarningPlayed = false;
      updateDisplay();
    }

    function nextFase() {
      currentIndex++;
      loadFase(currentIndex);
    }

    // FUNGSI ALARM (WEB AUDIO API - Tidak butuh file mp3!)
    function bunyikanAlarm() {
      try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gainNode = ctx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        osc.type = 'sine'; // Suara jernih seperti bel
        osc.frequency.value = 880; // Nada tinggi (Perhatian)
        
        // Suara memudar halus selama 1.5 detik
        gainNode.gain.setValueAtTime(1, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
        
        osc.start();
        osc.stop(ctx.currentTime + 1.5);
      } catch(e) {
        console.log("Browser tidak mendukung Audio otomatis.");
      }
    }

    function selesaiSesi() {
      document.getElementById('mainPanel').innerHTML = `
        <div class="text-center">
          <h1 style="font-size: 5rem; margin-bottom: 10px;">🎉</h1>
          <h2 style="font-size: 2.5rem; color: #38ef7d; font-weight: 700;">Pembelajaran Sukses!</h2>
          <p style="font-size: 1.2rem; color: rgba(255,255,255,0.7); margin-bottom: 30px;">Seluruh sintaks berjalan lancar. Rekam jejak Anda telah tersimpan.</p>
          <button class="btn-action btn-extend" onclick="window.location.href='index.html'">Kembali ke Beranda Awal</button>
        </div>
      `;
      document.getElementById('progressText').innerText = "Selesai";
    }
  </script>
</body>
</html>
