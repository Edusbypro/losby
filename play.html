<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Mode - Learning Organizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background: #0f2027; background: linear-gradient(to right, #2c5364, #203a43, #0f2027); 
      color: white; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; 
      display: flex; flex-direction: column; padding: 20px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 30px; }
    .top-bar h4 { font-weight: 700; margin: 0; color: #00d2ff; display: flex; align-items: center; gap: 10px;}
    
    .live-radar { display: inline-block; width: 12px; height: 12px; background: #ff4757; border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }

    .glass-panel { 
      background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); 
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; 
      flex-grow: 1; display: flex; flex-direction: column; justify-content: center; position: relative;
    }
    
    #faseTitle { font-size: 2rem; font-weight: 700; color: #00d2ff; text-transform: uppercase; letter-spacing: 2px;}
    #faseAktivitas { font-size: 1.3rem; color: #e0e0e0; margin-top: 15px; line-height: 1.6; min-height: 100px; }
    #fasePengalaman { display: inline-block; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2);}
    
    #boxSupervisi {
      display: none; background: rgba(20, 20, 20, 0.8); border-left: 5px solid #f1c40f;
      border-radius: 10px; padding: 20px; margin-top: 25px; box-shadow: 0 5px 20px rgba(241, 196, 15, 0.2); animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .sup-badge { background: #f1c40f; color: #111; padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: inline-block;}
    .sup-comment { font-size: 1.1rem; color: #f5f6fa; font-style: italic; }

    .timer-display { 
      font-size: 9rem; font-weight: 700; text-align: center; 
      text-shadow: 0 0 30px rgba(0, 210, 255, 0.3); font-variant-numeric: tabular-nums; 
      line-height: 1; margin: 30px 0; transition: color 0.3s, text-shadow 0.3s;
    }
    .warning { color: #ff4b2b !important; text-shadow: 0 0 40px rgba(255, 75, 43, 0.8) !important; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    
    .controls { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
    .btn-action { font-size: 1.1rem; font-weight: 600; padding: 15px 30px; border-radius: 50px; transition: 0.3s; border: none; cursor: pointer; }
    .btn-extend { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.5); }
    .btn-extend:hover { background: rgba(255,255,255,0.1); border-color: white; }
    
    /* Tombol Kembali Dibuat Lebih Halus Warnanya */
    .btn-prev { background: transparent; color: #a4b0be; border: 2px solid rgba(255,255,255,0.2); }
    .btn-prev:hover { background: rgba(255,255,255,0.05); color: white; border-color: rgba(255,255,255,0.5); }
    
    .btn-next { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3); }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(17, 153, 142, 0.5); }
    
    #progressText { color: rgba(255,255,255,0.5); font-weight: 600; font-size: 1.1rem; text-align: right; }
    #syncStatus { font-size: 0.75rem; color: #2ecc71; margin-top: 5px; font-weight: 400;}
  </style>
</head>
<body>

  <div class="top-bar">
    <h4 id="namaModelHeader"><span class="live-radar"></span> LIVE: Memuat...</h4>
    <div>
      <div id="progressText">Tahap 1 dari X</div>
      <div id="syncStatus">📡 Menghubungkan ke Server...</div>
    </div>
  </div>

  <div class="glass-panel" id="mainPanel">
    <div class="text-center">
      <div id="faseTitle">Memuat Fase...</div>
      <div id="fasePengalaman">Target: Memahami</div>
      
      <div style="max-width: 850px; margin: 0 auto; text-align: left;">
        <div id="faseAktivitas">Deskripsi aktivitas akan muncul di sini...</div>
        
        <div id="boxSupervisi">
          <div class="sup-badge" id="badgeSup">👁️ Catatan Kepala Sekolah: <span id="skorSup">Baik</span></div>
          <div class="sup-comment" id="komenSup">"Bagus sekali pendekatannya!"</div>
        </div>
      </div>
      
      <div class="timer-display" id="timerDisplay">00:00</div>
      
      <!-- PENAMBAHAN TOMBOL BACK -->
      <div class="controls">
        <button class="btn-action btn-prev" onclick="prevFase()" id="btnPrev" style="display: none;">⬅ Kembali</button>
        <button class="btn-action btn-extend" onclick="tambahWaktu()">+ 5 Menit</button>
        <button class="btn-action btn-next" onclick="nextFase()" id="btnNext">Lanjut Fase Berikutnya ➔</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzYzp1rzv10ya5yMA9f8YfISo31eIL-DuC6cuZKvDF79ytrUMH4Ssmsl4-KVhN-KA4wSg/exec";
    
    let sintaks = [];
    let dataSupervisi = [];
    let currentIndex = 0;
    
    let timerInterval;
    let timeRemaining = 0;
    let isWarningPlayed = false;
    
    // +++ VARIABEL BARU: MEMORI WAKTU UNTUK TOMBOL BACK +++
    let memoriWaktuFase = []; 

    document.addEventListener("DOMContentLoaded", function() {
      let dataSintaks = localStorage.getItem('lo_sintaks_play');
      let namaModel = localStorage.getItem('lo_nama_model');
      
      if(!dataSintaks) { alert("Tidak ada skenario kelas."); window.location.href = "index.html"; return; }

      sintaks = JSON.parse(dataSintaks);
      document.getElementById('namaModelHeader').innerHTML = `<span class="live-radar"></span> LIVE: ${namaModel}`;
      
      // Menyiapkan Memori Waktu di Awal (Merubah menit ke detik)
      sintaks.forEach(f => {
        memoriWaktuFase.push((f.durasi || 0) * 60);
      });

      let supStr = localStorage.getItem('lo_supervisi_data');
      if(supStr && supStr !== "undefined" && supStr !== "[]") {
        try { dataSupervisi = JSON.parse(supStr); } catch(e) {}
      }
      
      loadFase(0);
      tarikDataSupervisiLive();
      setInterval(tarikDataSupervisiLive, 15000); 
    });

    async function tarikDataSupervisiLive() {
      try {
        let idModulAktif = localStorage.getItem('lo_id_modul');
        if(!idModulAktif) return;

        let syncUI = document.getElementById('syncStatus');
        syncUI.innerText = "📡 Mengecek pembaruan Supervisi..."; syncUI.style.color = "#f1c40f";

        const res = await fetch(API_URL + "?action=getBank&t=" + new Date().getTime());
        const bankData = await res.json();
        
        let myModul = bankData.find(m => m.idModul === idModulAktif);
        
        if(myModul && myModul.nilaiSup && myModul.nilaiSup !== "[]") {
           dataSupervisi = JSON.parse(myModul.nilaiSup);
           localStorage.setItem('lo_supervisi_data', myModul.nilaiSup);
           cekDanTampilkanFeedback(); 
        }
        syncUI.innerText = "📡 Terhubung Live"; syncUI.style.color = "#2ecc71";
      } catch(e) { 
        document.getElementById('syncStatus').innerText = "⚠️ Gangguan Koneksi Radar"; document.getElementById('syncStatus').style.color = "#e74c3c";
      }
    }

    function cekDanTampilkanFeedback() {
      if(currentIndex >= sintaks.length) return;
      let faseSekarang = sintaks[currentIndex];
      let boxSup = document.getElementById('boxSupervisi');
      let foundFeedback = dataSupervisi.find(s => s.fase === faseSekarang.fase);
      
      if(foundFeedback && foundFeedback.skor !== "-") {
        boxSup.style.display = 'block';
        document.getElementById('skorSup').innerText = foundFeedback.skor;
        
        let badge = document.getElementById('badgeSup');
        if(foundFeedback.skor === "Sangat Baik") { badge.style.background = "#2ecc71"; badge.style.color = "white"; }
        else if(foundFeedback.skor === "Baik") { badge.style.background = "#3498db"; badge.style.color = "white"; }
        else if(foundFeedback.skor === "Cukup") { badge.style.background = "#f1c40f"; badge.style.color = "black"; }
        else { badge.style.background = "#e74c3c"; badge.style.color = "white"; } 
        
        document.getElementById('komenSup').innerText = foundFeedback.komentar ? `"${foundFeedback.komentar}"` : "Tidak ada catatan khusus tambahan.";
      } else {
        boxSup.style.display = 'none';
      }
    }

    function loadFase(index) {
      clearInterval(timerInterval);
      isWarningPlayed = false;
      document.getElementById('timerDisplay').classList.remove('warning');
      
      if (index >= sintaks.length) { selesaiSesi(); return; }
      
      let fase = sintaks[index];
      document.getElementById('faseTitle').innerText = fase.fase;
      document.getElementById('faseAktivitas').innerHTML = fase.aktivitas.replace(/\n/g, '<br>');
      document.getElementById('fasePengalaman').innerText = "Fokus Pengalaman: " + (fase.pengalaman || "Menyesuaikan");
      
      cekDanTampilkanFeedback();

      // MENGATUR MUNCUL/HILANGNYA TOMBOL BACK
      let btnPrev = document.getElementById('btnPrev');
      if(index > 0) { btnPrev.style.display = 'inline-block'; } 
      else { btnPrev.style.display = 'none'; }
      
      // MENGAMBIL WAKTU DARI MEMORI (Bukan mereset dari awal)
      timeRemaining = memoriWaktuFase[index]; 
      
      updateDisplay();

      // Jika fase yang dikunjungi kembali ternyata waktunya sudah habis, langsung kedipkan merah
      if(timeRemaining <= 0) {
        document.getElementById('timerDisplay').classList.add('warning');
      }

      timerInterval = setInterval(tick, 1000);
      
      document.getElementById('progressText').innerHTML = `Tahap ${index + 1} dari ${sintaks.length}`;
      if(index === sintaks.length - 1) { 
        document.getElementById('btnNext').innerText = "Akhiri Pembelajaran 🏁"; 
      } else {
        document.getElementById('btnNext').innerHTML = "Lanjut Fase Berikutnya ➔"; 
      }
    }

    function tick() {
      if (timeRemaining > 0) {
        timeRemaining--; 
        
        // Simpan sisa detik terbaru ke dalam memori setiap detiknya
        memoriWaktuFase[currentIndex] = timeRemaining;
        
        updateDisplay();
        
        if (timeRemaining === 60 && !isWarningPlayed) {
           document.getElementById('timerDisplay').classList.add('warning');
           bunyikanAlarm(); isWarningPlayed = true;
        }
      } else { 
        memoriWaktuFase[currentIndex] = 0; // Kunci di 0 jika habis
        document.getElementById('timerDisplay').classList.add('warning'); 
      }
    }

    function updateDisplay() {
      let m = Math.floor(timeRemaining / 60); let s = timeRemaining % 60;
      document.getElementById('timerDisplay').innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
    }

    function tambahWaktu() {
      timeRemaining += 300; 
      memoriWaktuFase[currentIndex] = timeRemaining; // Tambahkan juga ke memori
      document.getElementById('timerDisplay').classList.remove('warning');
      isWarningPlayed = false; updateDisplay();
    }

    function nextFase() {
      // Simpan jejak waktu sebelum lompat ke depan
      memoriWaktuFase[currentIndex] = timeRemaining;
      currentIndex++; loadFase(currentIndex);
    }

    // FUNGSI BARU UNTUK TOMBOL BACK
    function prevFase() {
      if(currentIndex > 0) {
        // Simpan jejak waktu saat ini sebelum mundur ke belakang
        memoriWaktuFase[currentIndex] = timeRemaining;
        currentIndex--; 
        loadFase(currentIndex);
      }
    }

    function bunyikanAlarm() {
      try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator(); let gainNode = ctx.createGain();
        osc.connect(gainNode); gainNode.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = 880; 
        gainNode.gain.setValueAtTime(1, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
        osc.start(); osc.stop(ctx.currentTime + 1.5);
      } catch(e) {}
    }

    function selesaiSesi() {
      document.getElementById('mainPanel').innerHTML = `
        <div class="text-center">
          <h1 style="font-size: 5rem; margin-bottom: 10px;">🎉</h1>
          <h2 style="font-size: 2.5rem; color: #38ef7d; font-weight: 700;">Pembelajaran Sukses!</h2>
          <p style="font-size: 1.2rem; color: rgba(255,255,255,0.7); margin-bottom: 30px;">Seluruh skenario telah dieksekusi.</p>
          <button class="btn-action btn-extend mx-2" onclick="window.location.href='index.html'">🏠 Home</button>
          <button class="btn-action btn-next mx-2" onclick="window.location.href='bank.html'">📚 Kembali ke Bank</button>
        </div>
      `;
      document.getElementById('progressText').innerText = "Selesai";
      document.getElementById('syncStatus').style.display = "none";
    }
  </script>
</body>
</html>
