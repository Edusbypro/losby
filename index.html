<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Organizer - TKA Surabaya</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      padding: 40px; 
      width: 100%; 
      max-width: 750px;
      animation: slideUp 0.8s ease-out forwards;
      opacity: 0; transform: translateY(30px);
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #2c3e50; font-weight: 700; text-align: center;
      margin-bottom: 30px; text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .form-label { font-weight: 600; color: #34495e; font-size: 0.9rem; margin-bottom: 0.3rem;}
    
    .form-control, .form-select {
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.7); transition: all 0.3s;
      font-size: 0.95rem;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 10px rgba(161, 196, 253, 0.5); border-color: #a1c4fd;
    }

    .btn-custom {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; color: white; font-weight: 600; font-size: 1.1rem;
      border-radius: 30px; padding: 12px 30px;
      transition: transform 0.3s, box-shadow 0.3s; width: 100%; margin-top: 10px;
    }

    .btn-custom:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 10px 20px rgba(118, 75, 162, 0.4); color: white;
    }
    
    optgroup {
      font-weight: 700;
      color: #2c3e50;
      background-color: #f1f2f6;
    }
    option {
      font-weight: 400;
      color: #2f3640;
      background-color: white;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h2>🚀 Learning Organizer</h2>
    <p class="text-center text-muted mb-4">Setup Awal Pembelajaran</p>

    <form id="formPerencanaan">
      <!-- Baris 1: Nama Guru dan Asal Sekolah -->
      <div class="row mb-3">
        <div class="col-md-6 mb-3 mb-md-0">
          <label class="form-label">Nama Guru</label>
          <input type="text" class="form-control" id="namaGuru" value="Ardiyatna Pranata" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Asal Sekolah</label>
          <input type="text" class="form-control" id="namaSekolah" placeholder="Contoh: SDN Kaliasin VII/286 Surabaya" required>
        </div>
      </div>
      
      <!-- Baris 2: Mapel dan Kelas -->
      <div class="row mb-4">
        <div class="col-md-8 mb-3 mb-md-0">
          <label class="form-label">Mata Pelajaran</label>
          <select class="form-select" id="mapel" required>
            <option value="" disabled selected>-- Pilih Mata Pelajaran --</option>
            <optgroup label="Pendidikan Agama dan Budi Pekerti">
              <option value="Pendidikan Agama Islam">Pendidikan Agama Islam</option>
              <option value="Pendidikan Agama Kristen">Pendidikan Agama Kristen</option>
              <option value="Pendidikan Agama Katolik">Pendidikan Agama Katolik</option>
              <option value="Pendidikan Agama Buddha">Pendidikan Agama Buddha</option>
              <option value="Pendidikan Agama Hindu">Pendidikan Agama Hindu</option>
              <option value="Pendidikan Agama Khonghucu">Pendidikan Agama Khonghucu</option>
            </optgroup>
            <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
            <option value="Matematika">Matematika</option>
            <option value="IPAS">IPAS (Ilmu Pengetahuan Alam dan Sosial)</option>
            <option value="PJOK">Pendidikan Jasmani, Olahraga, dan Kesehatan (PJOK)</option>
            <optgroup label="Seni dan Budaya">
              <option value="Seni Rupa">Seni Rupa</option>
              <option value="Seni Musik">Seni Musik</option>
              <option value="Seni Teater">Seni Teater</option>
              <option value="Seni Tari">Seni Tari</option>
            </optgroup>
            <option value="Bahasa Inggris">Bahasa Inggris (Pilihan/Wajib)</option>
            <optgroup label="Muatan Lokal">
              <option value="Bahasa Jawa">Bahasa Jawa</option>
            </optgroup>
            <option value="Ko Kurikuler">Ko Kurikuler</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Kelas</label>
          <input type="text" class="form-control" id="kelas" placeholder="Contoh: 6A" required>
        </div>
      </div>

      <!-- Baris 3: Waktu dan Model -->
      <div class="row mb-4">
        <div class="col-md-4 mb-3 mb-md-0">
          <label class="form-label">Total Waktu (Menit)</label>
          <input type="number" class="form-control" id="waktu" placeholder="Misal: 90" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Model Pembelajaran</label>
          <select class="form-select" id="modelPembelajaran" required>
            <option value="" disabled selected>Mengambil data dari server...</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-custom" id="btnLanjut">Lanjut ke Pengisian Sintaks ✨</button>
    </form>
  </div>

  <script>
    // --- GANTI URL DI BAWAH INI DENGAN URL DARI GOOGLE APPS SCRIPT ANDA ---
    const API_URL = "https://script.google.com/macros/s/AKfycbzYzp1rzv10ya5yMA9f8YfISo31eIL-DuC6cuZKvDF79ytrUMH4Ssmsl4-KVhN-KA4wSg/exec";
    
    document.addEventListener("DOMContentLoaded", async function() {
      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          redirect: 'follow',
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          }
        });
        const dataModel = await response.json();
        isiDropdownModel(dataModel);
      } catch (error) {
        console.error("Gagal mengambil data:", error);
        document.getElementById('modelPembelajaran').innerHTML = '<option value="" disabled selected>Gagal memuat data. Cek koneksi.</option>';
      }
    });

    function isiDropdownModel(dataModel) {
      let select = document.getElementById('modelPembelajaran');
      select.innerHTML = '<option value="" disabled selected>-- Pilih Model --</option>';
      
      let currentGroup = "";
      let optgroup = null;

      dataModel.forEach(function(model) {
        // Jika kelompoknya beda dengan yang sebelumnya, buat grup baru
        if(model.kelompok !== currentGroup) {
          optgroup = document.createElement('optgroup');
          optgroup.label = model.kelompok;
          select.appendChild(optgroup);
          currentGroup = model.kelompok;
        }

        // Buat opsi (option)
        let option = document.createElement('option');
        option.value = model.id;
        option.text = model.nama;
        
        // Memasukkan ke dalam optgroup agar rapi
        if(optgroup) {
          optgroup.appendChild(option);
        } else {
          select.appendChild(option);
        }
      });
    }

    // ---> LOGIKA TOMBOL SIMPAN <---
    document.getElementById('formPerencanaan').addEventListener('submit', async function(e) {
      e.preventDefault(); 
      
      let btn = document.getElementById('btnLanjut');
      btn.innerHTML = 'Menyimpan Setup... ⏳';
      btn.style.opacity = '0.7';
      btn.disabled = true;

      // Menangkap isian form (CP dan TP dikosongkan untuk diisi di halaman selanjutnya)
      let dataRPP = {
        nama: document.getElementById('namaGuru').value,
        sekolah: document.getElementById('namaSekolah').value,
        mapel: document.getElementById('mapel').value,
        kelas: document.getElementById('kelas').value,
        capaian: "", 
        tujuan: "",  
        waktu: document.getElementById('waktu').value,
        model: document.getElementById('modelPembelajaran').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(dataRPP)
        });

        const result = await response.json();

        if (result.status === "success") {
          // Menyimpan data penting ke memori browser
          let selectModel = document.getElementById('modelPembelajaran');
          let teksModel = selectModel.options[selectModel.selectedIndex].text;
          
          localStorage.setItem('lo_id_modul', result.idModul); // Menyimpan ID RPP
          localStorage.setItem('lo_id_model', dataRPP.model);  // Menyimpan Kode Model (M01, M02, dst)
          localStorage.setItem('lo_nama_model', teksModel);    // Menyimpan Nama Model

          alert("Setup Awal berhasil disimpan! Menuju pengisian sintaks...");
          
          // Mengalihkan ke Halaman 2
          window.location.href = "sintaks.html";
          
        } else {
          alert("Gagal menyimpan: " + result.message);
          btn.innerHTML = 'Lanjut ke Pengisian Sintaks ✨';
          btn.style.opacity = '1';
          btn.disabled = false;
        }
      } catch (error) {
        alert("Terjadi kesalahan koneksi saat menyimpan data.");
        console.error("Error:", error);
        btn.innerHTML = 'Lanjut ke Pengisian Sintaks ✨';
        btn.style.opacity = '1';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
